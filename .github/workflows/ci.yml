name: CI
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: python3 scripts/verify_contract.py
      - run: python3 scripts/verify_spaces.py
      - run: python3 scripts/verify_sources.py
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace --all-targets
      - run: cargo build --locked -p weave-compiler-sdk -p weave-language --lib --example compiler_sdk --bin weave
      - run: python3 scripts/check_compiler_sdk.py --native target/debug/examples/compiler_sdk --compiler target/debug/weave
      - run: cargo install --locked --path . --root install-check
      - name: Check installed compiler against independent interval oracle
        run: python3 scripts/check_interval_oracle.py --compiler install-check/bin/weave
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo check --locked --lib --target wasm32-unknown-unknown
      - run: cargo build --locked --example scalar_parity
      - run: cargo build --locked --example scalar_parity --target wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/check_scalar_parity.py --native target/debug/examples/scalar_parity --wasm target/wasm32-unknown-unknown/debug/examples/scalar_parity.wasm
      - run: cargo build --locked -p weave-compiler-sdk -p weave-language --lib --example compiler_sdk --bin weave
      - run: cargo build --locked -p weave-compiler-sdk --target wasm32-unknown-unknown
      - run: python3 scripts/check_compiler_sdk.py --native target/debug/examples/compiler_sdk --compiler target/debug/weave --wasm target/wasm32-unknown-unknown/debug/weave_compiler_sdk.wasm
